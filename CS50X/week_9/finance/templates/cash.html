{% extends "layout.html" %}

{% block title %}
    Add Cash
{% endblock %}

{% block main %}
        <main class="container py-5 text-center">

    <form action="/cash" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" min="1" name="plus_money" step="any" placeholder="Cash" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Add Cash</button>
    </form>

        </main>
{% endblock %}
