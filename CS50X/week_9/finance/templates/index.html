{% extends "layout.html" %}

{% block title %}
    C$50 Finance
{% endblock %}

{% block main %}
        <main class="container py-5 text-center">

    <table class="table table-striped">
        <thead>
            <tr>
                <th class="text-start">Symbol</th>
                <th class="text-end">Shares</th>
                <th class="text-end">Price</th>
                <th class="text-end">TOTAL</th>
            </tr>
        </thead>
       <tbody>

            {% for dado in dados %}
                <tr>
                    <td class="text-start">{{dado.symbol}}</td>
                    <td class="text-end">{{dado.shares}}</td>
                    <td class="text-end">{{dado.price | usd}}</td>
                    <td class="text-end">{{dado.total_value | usd}}</td>
                </tr>
            {% endfor %}

        </tbody>
        <tfoot>
            <tr>
                <td class="border-0 fw-bold text-end" colspan="3">Cash</td>
                <td class="border-0 text-end">{{ cash | usd }}</td>
            </tr>
            <tr>
                <td class="border-0 fw-bold text-end" colspan="3">TOTAL</td>
                <td class="border-0 w-bold text-end">{{ true_total | usd }}</td>
            </tr>
        </tfoot>
    </table>

        </main>
{% endblock %}
